[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-dm2"
version = "0.1.0"
description = "Computer-vision experiments for DM2-associated iris measurements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pandas>=2.2,<4",
    "scikit-image>=0.24,<1",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
deep = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
iris-dm2 = "iris_dm2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
